<!DOCTYPE html>
<html>
<head>
  <title>Asia Grand Tour 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

h1 {
  color: gold;
  font-size: 34px;
  margin-bottom: 25px;
  letter-spacing: 1px;
}

/* CARD */
.card {
  position: relative;
  display: block;
  margin: 25px auto;
  max-width: 420px;
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
  transform: scale(1.03);
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

.card:active {
  transform: scale(0.98);
}
/* IMAGE */
.hero {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

/* DARK GRADIENT OVER IMAGE */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.85) 0%,
    rgba(0,0,0,0.5) 40%,
    rgba(0,0,0,0.2) 70%,
    rgba(0,0,0,0.0) 100%
  );
}

/* FLAG */
.flag {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 20px;
}

/* COUNTRY NAME */

.card h2 {
  position: absolute;
  bottom: 32px;
  left: 18px;
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
  .days {
  position: absolute;
  bottom: 12px;
  left: 18px;
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,0.75);
} 
     /* CARD ANIMATION */
.card {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.8s ease forwards;
}

/* STAGGER EFFECT */
.card:nth-of-type(1) { animation-delay: 0.1s; }
.card:nth-of-type(2) { animation-delay: 0.25s; }
.card:nth-of-type(3) { animation-delay: 0.4s; }
.card:nth-of-type(4) { animation-delay: 0.55s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<h1>Asia Grand Tour 2026 ✈️</h1>

<a href="/japan.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80">
  <div class="flag">🇯🇵</div>
  <h2>Japan</h2>
  <p class="days">14 Days</p>
</a>
<a href="/korea.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1549692520-acc6669e2f0c?auto=format&fit=crop&w=800&q=80">
  <div class="flag">🇰🇷</div>
  <h2>South Korea</h2>
  <p class="days">11 Days</p>
</a>

<a href="/china.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=800&q=80">
  <div class="flag">🇨🇳</div>
  <h2>China</h2>
  <p class="days">14 Days</p>
</a>

<a href="/hongkong.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1506976785307-8732e854ad03?auto=format&fit=crop&w=800&q=80">
  <div class="flag">🇭🇰</div>
  <h2>Hong Kong</h2>
  <p class="days">3 Days</p>
</a>

</body>
</html>

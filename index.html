<!DOCTYPE html>
<html>
<head>
  <title>Asia Grand Tour 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
  html {
  scroll-behavior: smooth;
  }    
body {
  font-family: 'Inter', Arial, sans-serif;
  background: rgba(20,20,20,0.75);
backdrop-filter: blur(12px);
  color: white;
  margin: 0;
  padding: 28px 18px 120px;
  opacity: 0;
animation: fadeIn 0.8s ease forwards;
}
.card {
  position: relative;
  display: block;
  
  width: 100%;
  border-radius: 20px;
  margin: 24px 0;
  z-index: 1;
  overflow: hidden;
  text-decoration: none;
  color: white;

  background: #111;

  box-shadow: 
    0 10px 30px rgba(0,0,0,0.6),
    0 2px 8px rgba(0,0,0,0.8);

  opacity: 0;
  transform: translateY(30px) scale(0.98);

  transition: 
  opacity 0.6s ease,
  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
  box-shadow 0.35s ease;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #f5c542;
  text-align: center;
  margin-bottom: 24px;
}
.subtitle {
  text-align: center;
  color: rgba(255,255,255,0.7);
  margin-top: -10px;
  margin-bottom: 28px;
  letter-spacing: 2px;
  font-size: 13px;
  text-transform: uppercase;
.app-header {
  position: sticky;
  top: 0;
  z-index: 1000;

  padding-top: 10px;
  padding-bottom: 18px;

  background: rgba(17,17,17,0.75);
  backdrop-filter: blur(14px);
}

.hero {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;

  filter: contrast(1.05) saturate(1.05);
  transition: transform 0.6s ease;
}
 .card:hover .hero {
  transform: scale(1.06);
}     
  .card::after {
  content: "";
  position: absolute;
  inset: 0;

  background: linear-gradient(
    to top,
    rgba(0,0,0,0.65) 0%,
    rgba(0,0,0,0.25) 40%,
    rgba(0,0,0,0.05) 70%,
    rgba(0,0,0,0) 100%
  );
}    
  .card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 30px 70px rgba(0,0,0,0.9);
}     
  
  .card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background: rgba(255,255,255,0.02);
  z-index: 0;
}

 .days {
  position: absolute;
  bottom: 14px;
  left: 18px;
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
}

 .flag {
  position: absolute;
  top: 12px;
  left: 12px;
  font-size: 22px;
}
.card h2 {
  position: absolute;
  bottom: 36px;
  left: 18px;
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

 .card.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
/* STAGGER EFFECT */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.bottom-nav {
  position: fixed;
  bottom: calc(18px + env(safe-area-inset-bottom));
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);

  width: calc(100% - 36px);
  max-width: 500px;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding: 16px;

  border-radius: 24px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);

  border: 1px solid rgba(255,255,255,0.08);

  z-index: 1000;
  .bottom-nav div {
  font-size: 22px;
  opacity: 0.8;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.bottom-nav div:hover {
transform: translateY(-2px) scale(1.08);
opacity: 1;
.bottom-nav .active {
opacity: 1;
transform: scale(1.1);
  
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

@keyframes cardIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>
<div class="app-header">
  <h1>Asia Grand Tour 2026</h1>
  <p class="subtitle">Diamond Max Edition ✈️</p>
</div>


<a href="/japan.html" class="card">
  <img class="hero" src="https://picsum.photos/800/400?random=1">
  <div class="flag">🇯🇵</div>
  <h2>Japan</h2>
  <p class="days">14 Days</p>
</a>
<a href="/korea.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=2000&q=100">
  <div class="flag">🇰🇷</div>
  <h2>South Korea</h2>
  <p class="days">11 Days</p>
</a>

<a href="/china.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=2000&q=100&v=3">
  <div class="flag">🇨🇳</div>
  <h2>China</h2>
  <p class="days">14 Days</p>
</a>

<a href="/hongkong.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1506976785307-8732e854ad03?auto=format&fit=crop&w=2000&q=100&v=4">
  <div class="flag">🇭🇰</div>
  <h2>Hong Kong</h2>
  <p class="days">3 Days</p>
</a>
<script>
const cards = document.querySelectorAll('.card');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
    }
  });
}, { threshold: 0.2 });

cards.forEach(card => {
  observer.observe(card);
});
</script>
<div class="bottom-nav">
<div class="active">🏠</div>
<div>🗺️</div>
<div>📍</div>
<div>⚙️</div>
</div>
</body>
</html>

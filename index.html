<!DOCTYPE html>
<html>
<head>
  <title>Asia Grand Tour 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
  html {
  scroll-behavior: smooth;
  }    
body {
  font-family: 'Inter', Arial, sans-serif;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px 16px 40px;
  opacity: 0;
animation: fadeIn 0.8s ease forwards;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #f5c542;
  text-align: center;
  margin-bottom: 24px;
}

/* CARD */
.card {
  position: relative;
  display: block;
  margin: 18px 0;
  width: 100%;
  border-radius: 20px;
  z-index: 1;
  overflow: hidden;
  text-decoration: none;
  color: white;

  background: #111;

  /* Luxury depth (no blur) */
  box-shadow: 
    0 10px 30px rgba(0,0,0,0.6),
    0 2px 8px rgba(0,0,0,0.8);

  /* Smooth but SAFE (no blur effect) */
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background: rgba(255,255,255,0.02);
  z-index: 0;
}      
.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 30px 70px rgba(0,0,0,0.9);
}
.card:active {
  transform: scale(0.98);
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 30px 70px rgba(0,0,0,0.9);
}

  .card {
  will-change: transform;
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 30px 70px rgba(0,0,0,0.9);
}


.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 30px 70px rgba(0,0,0,0.9);
}
.card h2,
.card .days {
  transition: transform 0.3s ease;
}    
/* IMAGE */

.hero {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;

  /* 🔥 Cinematic upgrade */
  filter: contrast(1.05) saturate(1.05);
}
/* DARK GRADIENT OVER IMAGE */
.card::after {
  content: "";
  position: absolute;
  inset: 0;

  background: linear-gradient(
    to top,
    rgba(0,0,0,0.65) 0%,
    rgba(0,0,0,0.25) 40%,
    rgba(0,0,0,0.05) 70%,
    rgba(0,0,0,0) 100%
  );
}

/* FLAG */
.flag {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 20px;
}

/* COUNTRY NAME */

.flag {
  position: absolute;
  top: 12px;
  left: 12px;
  font-size: 22px;
}

.card h2 {
  position: absolute;
  bottom: 36px;
  left: 18px;
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.5px;

  /* 🔥 ADD THIS */
  text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

.days {
  position: absolute;
  bottom: 14px;
  left: 18px;
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,0.85);

  /* 🔥 ADD THIS */
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
}
     /* CARD ANIMATION */

/* CARD ANIMATION */

.card {
  opacity: 0;
  transform: translateY(30px) scale(0.98);
  transition: 
    opacity 0.6s ease,
    transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.card.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
/* STAGGER EFFECT */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

@keyframes cardIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>

<h1>Asia Grand Tour 2026 ✈️🔥</h1>

<a href="/japan.html" class="card">
  <img class="hero" src="https://picsum.photos/800/400?random=1">
  <div class="flag">🇯🇵</div>
  <h2>Japan</h2>
  <p class="days">14 Days</p>
</a>
  <div class="flag">🇯🇵</div>
  <h2>Japan</h2>
  <p class="days">14 Days</p>
</a>
<a href="/korea.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1549692520-acc6669e2f0c?auto=format&fit=crop&w=2000&q=100&v=2">
  <div class="flag">🇰🇷</div>
  <h2>South Korea</h2>
  <p class="days">11 Days</p>
</a>

<a href="/china.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=2000&q=100&v=3">
  <div class="flag">🇨🇳</div>
  <h2>China</h2>
  <p class="days">14 Days</p>
</a>

<a href="/hongkong.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-1506976785307-8732e854ad03?auto=format&fit=crop&w=2000&q=100&v=4">
  <div class="flag">🇭🇰</div>
  <h2>Hong Kong</h2>
  <p class="days">3 Days</p>
</a>
<script>
const cards = document.querySelectorAll('.card');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
    }
  });
}, { threshold: 0.2 });

cards.forEach(card => {
  observer.observe(card);
});
</script>
</body>
</html>

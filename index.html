<!DOCTYPE html>
<html>
<head>
  <title>Asia Grand Tour 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
body {
  font-family: 'Inter', Arial, sans-serif;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px 16px 40px;
  opacity: 0;
animation: fadeIn 0.8s ease forwards;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #f5c542;
  text-align: center;
  margin-bottom: 24px;
}

/* CARD */
.card {
  position: relative;
  display: block;
  margin: 16px 0;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  color: white;

  /* REMOVE ALL TRANSFORMS */
  transform: none !important;
}
.card:hover {
  transform: translateY(-4px);
}
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

.card:hover .hero {
  transform: scale(1.02);
}


.card:active {
  transform: scale(0.98);
}
  .card {
  will-change: transform;
}

.card:hover h2 {
  transform: translateY(-2px);
}

.card:hover .days {
  transform: translateY(-2px);
}

.card h2,
.card .days {
  transition: transform 0.3s ease;
}    
/* IMAGE */

.hero {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;

  /* REMOVE ALL EFFECTS */
  transform: none !important;
  transition: none !important;
  filter: none !important;
  backdrop-filter: none !important;
}
/* DARK GRADIENT OVER IMAGE */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.6),
    rgba(0,0,0,0.2),
    rgba(0,0,0,0)
  );
}

/* FLAG */
.flag {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 20px;
}

/* COUNTRY NAME */

.card h2 {
  position: absolute;
  bottom: 32px;
  left: 18px;
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
  .days {
  position: absolute;
  bottom: 12px;
  left: 18px;
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,0.75);
} 
     /* CARD ANIMATION */

.card {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.card.show {
  opacity: 1;
  transform: translateY(0);
}   
/* STAGGER EFFECT */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  to {
    opacity: 1;
  }
}

@keyframes cardIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>

<h1>Asia Grand Tour 2026 ✈️</h1>

<a href="/japan.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-xxxxx?auto=format&w=2000&q=100">
  <div class="flag">🇯🇵</div>
  <h2>Japan</h2>
  <p class="days">14 Days</p>
</a>
<a href="/korea.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-xxxxx?auto=format&w=2000&q=100">
  <div class="flag">🇰🇷</div>
  <h2>South Korea</h2>
  <p class="days">11 Days</p>
</a>

<a href="/china.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-xxxxx?auto=format&w=2000&q=100">
  <div class="flag">🇨🇳</div>
  <h2>China</h2>
  <p class="days">14 Days</p>
</a>

<a href="/hongkong.html" class="card">
  <img class="hero" src="https://images.unsplash.com/photo-xxxxx?auto=format&w=2000&q=100">
  <div class="flag">🇭🇰</div>
  <h2>Hong Kong</h2>
  <p class="days">3 Days</p>
</a>
<script>
const cards = document.querySelectorAll('.card');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
    }
  });
}, { threshold: 0.2 });

cards.forEach(card => {
  observer.observe(card);
});
</script>
</body>
</html>
